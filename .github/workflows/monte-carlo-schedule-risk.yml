name: monte-carlo-schedule-risk

on:
  push:
    paths:
      - "coursework/software-engineering-management/monte_carlo_schedule_risk/**"
  pull_request:
    paths:
      - "coursework/software-engineering-management/monte_carlo_schedule_risk/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coursework/software-engineering-management/monte_carlo_schedule_risk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Reproduce analysis
        run: python main.py
